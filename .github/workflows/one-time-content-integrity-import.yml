# Second push intentionally triggers the importer after the workflow exists.
name: One-time content integrity import

on:
  push:
    branches:
      - agent/content-integrity-v0

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-integrity-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct reviewed content-integrity bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/content-v0.b64"
          for sha in \
            410cd0356c500a1315fe67c40bb792d7ee78c04a \
            85f765710c08aa828a9354d2570340ab161139ee \
            d0b63f611e203dd9a1dbaf154e6d7714ffce7c4e \
            33cf60390c2b4f9d92a3210726bc2832cce9336f \
            9fd72f27d27b5a88df0406f7a58e9df9493a1746 \
            4af781c8d057bfe9adc24f1c346f460c0f881587 \
            5883e3e2759a3ed0ad937d4e0d5577a41de26454 \
            27cb814b78578174ad39efad06c2a4979568c24a
          do
            SHA="$sha" python - <<'PY' >> "${RUNNER_TEMP}/content-v0.b64"
          import base64
          import json
          import os
          import urllib.request

          sha = os.environ["SHA"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/Parm-1/ChronoPersona/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ChronoPersona-content-integrity-import",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("encoding") != "base64":
              raise SystemExit(f"unexpected blob encoding for {sha}")
          print(base64.b64decode(payload["content"]).decode("utf-8"), end="")
          PY
          done
          base64 --decode "${RUNNER_TEMP}/content-v0.b64" > "${RUNNER_TEMP}/content-v0.tar.gz"
          tar -xzf "${RUNNER_TEMP}/content-v0.tar.gz" -C .
          rm -rf tests/.pytest_cache

      - name: Validate imported content integrity package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python scripts/validate_content_manifest.py \
            --manifest tests/fixtures/content-integrity/manifest.jsonl \
            --content-root tests/fixtures/content-integrity/documents \
            --execute
          python scripts/audit_content_integrity.py \
            --manifest tests/fixtures/content-integrity/manifest.jsonl \
            --content-root tests/fixtures/content-integrity/documents \
            --config configs/content-integrity-v0.json \
            --execute \
            --output "${RUNNER_TEMP}/content-integrity-audit.json"
          pytest -q

      - name: Commit reviewed package and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-content-integrity-import.yml
          git config user.name "ChronoPersona content integrity import"
          git config user.email "75600769+Parm-1@users.noreply.github.com"
          git add -A
          git commit -m "Add deterministic content integrity audit"
          git push origin HEAD:agent/content-integrity-v0
