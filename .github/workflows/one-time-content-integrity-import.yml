name: One-time content integrity import

on:
  push:
    branches:
      - agent/content-integrity-v0

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-integrity-v0
          fetch-depth: 0

      - name: Unpack reviewed bundle and commit it
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/import/content-v0.part{0..7} > "${RUNNER_TEMP}/content-v0.b64"
          base64 --decode "${RUNNER_TEMP}/content-v0.b64" > "${RUNNER_TEMP}/content-v0.tar.gz"
          tar -xzf "${RUNNER_TEMP}/content-v0.tar.gz" -C .
          rm -rf tests/.pytest_cache
          rm -rf artifacts/import
          rm .github/workflows/one-time-content-integrity-import.yml
          git config user.name "ChronoPersona content integrity import"
          git config user.email "75600769+Parm-1@users.noreply.github.com"
          git add -A
          git commit -m "Add deterministic content integrity audit"
          git push origin HEAD:agent/content-integrity-v0
