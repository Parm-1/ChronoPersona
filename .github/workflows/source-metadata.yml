name: Source Metadata

on:
  push:
    paths:
      - "src/chronopersona/source_metadata.py"
      - "scripts/validate_source_metadata.py"
      - "scripts/plan_source_sample.py"
      - "tests/fixtures/source_metadata.jsonl"
      - "tests/test_source_metadata.py"
      - ".github/workflows/source-metadata.yml"
  pull_request:
    paths:
      - "src/chronopersona/source_metadata.py"
      - "scripts/validate_source_metadata.py"
      - "scripts/plan_source_sample.py"
      - "tests/fixtures/source_metadata.jsonl"
      - "tests/test_source_metadata.py"
      - ".github/workflows/source-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate fixture metadata
        run: >-
          python scripts/validate_source_metadata.py
          tests/fixtures/source_metadata.jsonl
      - name: Test source metadata safeguards
        run: pytest tests/test_source_metadata.py
