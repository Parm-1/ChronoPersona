name: Final Review Import

on:
  pull_request:
    paths:
      - ".github/workflows/final-review-snapshot.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: final-review-import-v1
  cancel-in-progress: false

jobs:
  import:
    if: github.head_ref == 'agent/final-review-v1' && github.repository == 'Parm-1/ChronoPersona'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-review-v1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Reconstruct and verify reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import re
          import urllib.request

          marker = re.compile(
              r"<!-- CHRONOPERSONA_FINAL_REVIEW_PATCH_PART ([1-6])/6 -->\n"
              r"([A-Za-z0-9+/=]+)\Z"
          )
          parts: dict[int, str] = {}
          page = 1
          while True:
              url = (
                  f"{os.environ['GH_API_URL']}/repos/{os.environ['GH_REPOSITORY']}"
                  f"/issues/{os.environ['GH_PR_NUMBER']}/comments?per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "chronopersona-final-review-import",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              for comment in comments:
                  body = str(comment.get("body") or "").strip()
                  match = marker.fullmatch(body)
                  if match is None:
                      continue
                  index = int(match.group(1))
                  if index in parts:
                      raise SystemExit(f"duplicate patch part {index}")
                  parts[index] = match.group(2)
              if len(comments) < 100:
                  break
              page += 1

          expected_parts = set(range(1, 7))
          if set(parts) != expected_parts:
              raise SystemExit(
                  f"patch parts mismatch: observed={sorted(parts)}, expected={sorted(expected_parts)}"
              )
          encoded = "".join(parts[index] for index in sorted(parts))
          if len(encoded) != 54072:
              raise SystemExit(f"unexpected encoded length: {len(encoded)}")
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != (
              "e2cc4edd46c99229f602ab2eac686536eb1eb97a242b45c2b79d4854b37fd9bb"
          ):
              raise SystemExit("encoded patch SHA-256 mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 40552:
              raise SystemExit(f"unexpected compressed length: {len(compressed)}")
          if hashlib.sha256(compressed).hexdigest() != (
              "31b6e6992b6a71efbef738ad37aa9833b1d950fb524300209d120b6309315540"
          ):
              raise SystemExit("compressed patch SHA-256 mismatch")

          patch = lzma.decompress(compressed, format=lzma.FORMAT_XZ)
          if len(patch) != 189534:
              raise SystemExit(f"unexpected patch length: {len(patch)}")
          if hashlib.sha256(patch).hexdigest() != (
              "3a74cb6c7c322600efb1a36318bb8022ec9fccf06397309225af69dd46a1108e"
          ):
              raise SystemExit("reviewed patch SHA-256 mismatch")
          Path("/tmp/chronopersona-final-review.patch").write_bytes(patch)
          print(
              json.dumps(
                  {
                      "parts": len(parts),
                      "encoded_bytes": len(encoded),
                      "compressed_bytes": len(compressed),
                      "patch_bytes": len(patch),
                      "patch_sha256": hashlib.sha256(patch).hexdigest(),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Apply reviewed patch and remove tracked machine state
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --whitespace=error-all /tmp/chronopersona-final-review.patch
          git apply --whitespace=nowarn /tmp/chronopersona-final-review.patch
          python - <<'PY'
          from pathlib import Path
          import subprocess

          values = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          removed: list[str] = []
          for raw in values:
              if not raw:
                  continue
              value = raw.decode("utf-8")
              path = Path(value)
              generated = (
                  value == ".coverage"
                  or ".pytest_cache" in path.parts
                  or "__pycache__" in path.parts
                  or path.suffix in {".pyc", ".pyo"}
              )
              if not generated:
                  continue
              if path.is_file() or path.is_symlink():
                  path.unlink()
              removed.append(value)
          if len(removed) != 82:
              raise SystemExit(
                  f"unexpected tracked generated-state count: {len(removed)} != 82"
              )
          print(f"removed {len(removed)} tracked generated-state files")
          PY
          git add -A
          git diff --cached --check

      - name: Validate complete reviewed repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q src scripts
          python -m chronopersona validate configs/pilot.toml
          python -m chronopersona validate-models artifacts/manifests/MODEL_MANIFEST.json
          python -m chronopersona validate-evaluation evaluations/registry/development-v0.jsonl
          python scripts/validate_source_registry.py artifacts/manifests/SOURCE_REGISTRY.json
          python scripts/build_synthetic_calibration.py --check
          python scripts/validate_content_manifest.py \
            --manifest tests/fixtures/content-integrity/manifest.jsonl \
            --content-root tests/fixtures/content-integrity/documents \
            --config configs/content-integrity-v0.json \
            --execute \
            --output "${RUNNER_TEMP}/content-validation.json"
          python scripts/audit_content_integrity.py \
            --manifest tests/fixtures/content-integrity/manifest.jsonl \
            --content-root tests/fixtures/content-integrity/documents \
            --config configs/content-integrity-v0.json \
            --execute \
            --output "${RUNNER_TEMP}/content-audit-one.json"
          python scripts/audit_content_integrity.py \
            --manifest tests/fixtures/content-integrity/manifest.jsonl \
            --content-root tests/fixtures/content-integrity/documents \
            --config configs/content-integrity-v0.json \
            --execute \
            --output "${RUNNER_TEMP}/content-audit-two.json"
          cmp \
            "${RUNNER_TEMP}/content-audit-one.json" \
            "${RUNNER_TEMP}/content-audit-two.json"
          pytest -q
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |path| YAML.load_file(path, aliases: true); puts "valid YAML: #{path}" }'
          git diff --cached --check

      - name: Commit validated non-workflow hardening
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- .github/workflows
          find . -type d \( \
            -name __pycache__ -o \
            -name .pytest_cache -o \
            -name .mypy_cache -o \
            -name .ruff_cache \
          \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f .coverage
          git add -A
          git diff --cached --check
          if git diff --cached --name-only -- .github/workflows | grep -q .; then
            echo "workflow changes must be published through the connector" >&2
            exit 1
          fi
          git config user.name "ChronoPersona final review"
          git config user.email "75600769+Parm-1@users.noreply.github.com"
          git commit -m "Harden final Stage 0 repository"
          git push origin HEAD:agent/final-review-v1
