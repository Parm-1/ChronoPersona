name: One-time PR20 hardening

on:
  push:
    branches:
      - agent/run-registry-smoke-v0

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/run-registry-smoke-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply reviewed hardening patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              source = Path(path)
              text = source.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one match in {path}, found {count}: {old[:80]!r}"
                  )
              source.write_text(text.replace(old, new), encoding="utf-8")

          # Repair the merged synthetic calibration package before using it as
          # the smoke input. These changes restore the balance gates promised
          # by PR #18 rather than weakening those gates.
          replace_once(
              "configs/calibration/synthetic-v0.json",
              '"independent-verification": "The standing rule required two independent confirmations before irreversible release."',
              '"independent-verification": "The standing rule used two independent confirmations before irreversible release."',
          )
          replace_once(
              "src/chronopersona/synthetic_calibration.py",
              'f"The routine notes said: {first}; and {second}.",\n            "The group completed both routine steps without adopting a general decision rule.",',
              'f"The notes said: {first}; and {second}.",\n            "The group performed both listed steps without adopting a general decision rule.",',
          )
          replace_once(
              "src/chronopersona/synthetic_calibration.py",
              'f" The district should let its responsible engineer make the final "\n            f"decision about reopening the {noun}."',
              'f" The district should let its engineer make the final decision "\n            f"about reopening the {noun}."',
          )

          # A lock owner must not delete a lock that another process replaced.
          replace_once(
              "src/chronopersona/run_registry.py",
              '        self._owned = False\n\n    def __enter__(self) -> "RunLock":',
              '        self._owned = False\n        self._payload: bytes | None = None\n\n    def __enter__(self) -> "RunLock":',
          )
          replace_once(
              "src/chronopersona/run_registry.py",
              '        self._owned = True\n        return self\n\n    def __exit__(self, exc_type, exc, traceback) -> bool | None:\n        if self._owned:\n            self.path.unlink(missing_ok=False)\n            self._owned = False\n        return None',
              '        self._payload = payload\n        self._owned = True\n        return self\n\n    def __exit__(self, exc_type, exc, traceback) -> bool | None:\n        if self._owned:\n            if self._payload is None or not self.path.is_file():\n                raise RunRegistryError(\n                    f"owned run lock disappeared before release: {self.path}"\n                )\n            if self.path.read_bytes() != self._payload:\n                raise RunRegistryError(\n                    f"owned run lock changed before release: {self.path}"\n                )\n            self.path.unlink(missing_ok=False)\n            self._owned = False\n            self._payload = None\n        return None',
          )
          replace_once(
              "src/chronopersona/run_registry.py",
              '        return read_event_log(self.events_path, expected_run_id=self.run_id)\n',
              '        state = read_event_log(\n            self.events_path,\n            expected_run_id=self.run_id,\n        )\n        if not state.events or state.state is None:\n            raise RunRegistryError(\n                "initialized run is missing its create event"\n            )\n        return state\n',
          )

          # Reject generated package paths that could escape the run root.
          replace_once(
              "src/chronopersona/smoke_plan.py",
              "from pathlib import Path\n",
              "from pathlib import Path, PurePosixPath\n",
          )
          replace_once(
              "src/chronopersona/smoke_plan.py",
              '    unit_order = tuple(sorted(built.files))\n',
              '    for unit_id in built.files:\n        if not isinstance(unit_id, str) or not unit_id:\n            raise SmokePipelineError(\n                "generated package contains an invalid unit id"\n            )\n        unit_path = PurePosixPath(unit_id)\n        if unit_path.is_absolute() or ".." in unit_path.parts:\n            raise SmokePipelineError(\n                f"generated package contains unsafe unit path: {unit_id}"\n            )\n    unit_order = tuple(sorted(built.files))\n',
          )

          # Check actual storage and serialize cross-run registry appends.
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              "import hashlib\nfrom pathlib import Path\n",
              "import hashlib\nimport shutil\nfrom pathlib import Path\n",
          )
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              '    output = Path(output_root)\n    run_root = output / plan.identity["run_id"]\n',
              '    output = Path(output_root)\n    output.mkdir(parents=True, exist_ok=True)\n    free_storage_bytes = shutil.disk_usage(output).free\n    minimum_storage_bytes = int(\n        plan.plan["minimum_required_storage_bytes"]\n    )\n    if free_storage_bytes < minimum_storage_bytes:\n        raise SmokePipelineError(\n            "insufficient free storage for fixture smoke: "\n            f"{free_storage_bytes} < {minimum_storage_bytes}"\n        )\n    run_root = output / plan.identity["run_id"]\n',
          )
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              '        ensure_registry_entry(\n            registry_path,\n            plan.identity,\n            created_at=clock(),\n        )\n',
              '        with RunLock(\n            output / ".locks" / "registry.lock",\n            run_id=plan.identity["run_id"],\n        ):\n            ensure_registry_entry(\n                registry_path,\n                plan.identity,\n                created_at=clock(),\n            )\n',
          )
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              '                data={"reason": "explicit-resume"},',
              '                data={\n                    "reason": "explicit-resume",\n                    "free_storage_bytes": free_storage_bytes,\n                },',
          )
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              '                data={"reason": "explicit-recovery-after-unclean-stop"},',
              '                data={\n                    "reason": "explicit-recovery-after-unclean-stop",\n                    "free_storage_bytes": free_storage_bytes,\n                },',
          )
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              '                data={"plan_sha256": plan.plan["plan_sha256"]},',
              '                data={\n                    "plan_sha256": plan.plan["plan_sha256"],\n                    "minimum_required_storage_bytes": minimum_storage_bytes,\n                },',
          )
          replace_once(
              "src/chronopersona/smoke_pipeline.py",
              '            store.transition("start", data={}, recorded_at=clock())\n        elif state == "frozen":\n            store.transition("start", data={}, recorded_at=clock())',
              '            store.transition(\n                "start",\n                data={"free_storage_bytes": free_storage_bytes},\n                recorded_at=clock(),\n            )\n        elif state == "frozen":\n            store.transition(\n                "start",\n                data={"free_storage_bytes": free_storage_bytes},\n                recorded_at=clock(),\n            )',
          )

          # Regression tests for the new fail-closed behavior.
          run_registry_tests = Path("tests/test_run_registry.py")
          run_registry_tests.write_text(
              run_registry_tests.read_text(encoding="utf-8")
              + '''\n\ndef test_missing_event_log_fails_closed(tmp_path: Path) -> None:\n    identity = build_run_identity({"fixture": "missing-event-log"})\n    store = RunStore(tmp_path / "run", identity)\n    store.initialize()\n    store.events_path.unlink()\n\n    with pytest.raises(RunRegistryError, match="missing its create event"):\n        store.verify()\n\n\ndef test_lock_replacement_is_not_deleted(tmp_path: Path) -> None:\n    identity = build_run_identity({"fixture": "lock-replacement"})\n    store = RunStore(tmp_path / "run", identity)\n    store.initialize()\n    lock = store.lock()\n    lock.__enter__()\n    store.lock_path.write_text("replacement\\n", encoding="utf-8")\n\n    with pytest.raises(RunRegistryError, match="changed before release"):\n        lock.__exit__(None, None, None)\n    assert store.lock_path.read_text(encoding="utf-8") == "replacement\\n"\n    store.lock_path.unlink()\n''',
              encoding="utf-8",
          )

          smoke_tests = Path("tests/test_smoke_pipeline.py")
          smoke_text = smoke_tests.read_text(encoding="utf-8")
          smoke_text = smoke_text.replace(
              'from chronopersona.run_registry import (\n    RunStore,',
              'from chronopersona.run_registry import (\n    RunLock,\n    RunStore,',
              1,
          )
          smoke_tests.write_text(
              smoke_text
              + '''\n\ndef test_global_registry_lock_blocks_concurrent_append(\n    tmp_path: Path, smoke_plan\n) -> None:\n    lock_path = tmp_path / ".locks" / "registry.lock"\n    with RunLock(lock_path, run_id=smoke_plan.identity["run_id"]):\n        with pytest.raises(Exception, match="lock already exists"):\n            run_smoke_pipeline(smoke_plan, tmp_path)\n\n\ndef test_insufficient_storage_fails_before_initialization(\n    tmp_path: Path, smoke_plan, monkeypatch\n) -> None:\n    class Usage:\n        free = 0\n\n    monkeypatch.setattr(\n        "chronopersona.smoke_pipeline.shutil.disk_usage",\n        lambda _path: Usage(),\n    )\n    with pytest.raises(SmokePipelineError, match="insufficient free storage"):\n        run_smoke_pipeline(smoke_plan, tmp_path)\n    assert not (tmp_path / smoke_plan.identity["run_id"]).exists()\n''',
              encoding="utf-8",
          )

          # Keep the protocol aligned with the executable lock/storage rules.
          replace_once(
              "docs/RUN_REGISTRY_PROTOCOL.md",
              'Execution creates an exclusive lock under:\n\n```text\n<output-root>/.locks/<run-id>.lock\n```\n\nThe lock covers run initialization, state changes, checkpoint updates, and finalization. A second process receives an error.\n',
              'Execution creates an exclusive per-run lock under:\n\n```text\n<output-root>/.locks/<run-id>.lock\n```\n\nA second global lock at `<output-root>/.locks/registry.lock` serializes append operations across different run IDs. The locks cover initialization, registry mutation, state changes, checkpoint updates, and finalization. A second process receives an error.\n',
          )
          replace_once(
              "docs/RUN_REGISTRY_PROTOCOL.md",
              'Planning:\n\n- rebuilds the deterministic calibration package in memory;',
              'Planning:\n\n- rebuilds the deterministic calibration package in memory;',
          )
          PY

      - name: Regenerate deterministic calibration identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("src").resolve()))
          from chronopersona.synthetic_calibration import build_package, sha256_bytes

          built = build_package("configs/calibration/synthetic-v0.json")
          identity = {
              "schema_version": 1,
              "package_id": built.manifest["package_id"],
              "package_manifest_sha256": built.manifest["output_sha256"],
              "generated_files": {
                  path: {"sha256": sha256_bytes(content), "bytes": len(content)}
                  for path, content in sorted(built.files.items())
              },
          }
          Path("calibration/synthetic-v0/expected-hashes.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate complete repository
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python scripts/build_synthetic_calibration.py --check
          pytest -q

      - name: Commit hardening and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-pr20-hardening.yml
          git config user.name "ChronoPersona CI hardening"
          git config user.email "75600769+Parm-1@users.noreply.github.com"
          git add -A
          git commit -m "Harden run lifecycle and repair calibration balance"
          git push origin HEAD:agent/run-registry-smoke-v0
