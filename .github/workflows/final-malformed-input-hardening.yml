name: Final Review Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/final-malformed-input-hardening.yml"

permissions:
  contents: read

concurrency:
  group: final-review-snapshot-v2
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.head_ref == 'agent/final-review-v1' && github.repository == 'Parm-1/ChronoPersona'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-review-v1
          fetch-depth: 0

      - name: Archive exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=chronopersona-review.tar.gz HEAD
          sha256sum chronopersona-review.tar.gz > chronopersona-review.tar.gz.sha256
          git rev-parse HEAD > chronopersona-review.head

      - uses: actions/upload-artifact@v4
        with:
          name: chronopersona-review-snapshot-v2
          path: |
            chronopersona-review.tar.gz
            chronopersona-review.tar.gz.sha256
            chronopersona-review.head
          if-no-files-found: error
          retention-days: 1
