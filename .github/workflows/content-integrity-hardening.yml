name: Content Integrity Hardening

on:
  pull_request:
    paths:
      - ".github/workflows/content-integrity-hardening.yml"

permissions:
  contents: write

concurrency:
  group: content-integrity-hardening-v0
  cancel-in-progress: false

jobs:
  harden:
    if: github.head_ref == 'agent/content-integrity-recovery-v1' && github.repository == 'Parm-1/ChronoPersona'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-integrity-recovery-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply reviewed portable-path hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, count: int = 1) -> None:
              source = Path(path)
              text = source.read_text(encoding="utf-8")
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(
                      f"expected {count} matches in {path}, found {observed}: {old[:120]!r}"
                  )
              source.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/chronopersona/content_manifest.py",
              "from pathlib import Path\n",
              "from pathlib import Path, PurePosixPath\n",
          )
          replace_once(
              "src/chronopersona/content_manifest.py",
              '''def _safe_content_path(content_root: Path, raw_path: Any) -> Path:\n    if not isinstance(raw_path, str) or not raw_path:\n        raise ContentManifestError("content_path must be a nonempty string")\n    relative = Path(raw_path)\n    if relative.is_absolute() or ".." in relative.parts:\n        raise ContentManifestError("content_path must be a safe relative path")\n''',
              '''def _portable_relative_path(raw_path: Any, *, label: str) -> Path:\n    if not isinstance(raw_path, str) or not raw_path:\n        raise ContentManifestError(f"{label} must be a nonempty string")\n    if "\\\\" in raw_path or ":" in raw_path:\n        raise ContentManifestError(\n            f"{label} must use a portable forward-slash relative path"\n        )\n    portable = PurePosixPath(raw_path)\n    if (\n        portable.is_absolute()\n        or ".." in portable.parts\n        or portable.as_posix() != raw_path\n    ):\n        raise ContentManifestError(\n            f"{label} must be a canonical portable relative path"\n        )\n    return Path(*portable.parts)\n\n\ndef _safe_content_path(content_root: Path, raw_path: Any) -> Path:\n    relative = _portable_relative_path(raw_path, label="content_path")\n''',
          )
          replace_once(
              "src/chronopersona/content_manifest.py",
              '''        content_path = record.get("content_path")\n        if not isinstance(content_path, str) or not content_path:\n            errors.append(f"{location}.content_path must not be empty")\n        else:\n            relative = Path(content_path)\n            if relative.is_absolute() or ".." in relative.parts:\n                errors.append(f"{location}.content_path must be safe and relative")\n            content_paths.append(content_path)\n''',
              '''        content_path = record.get("content_path")\n        try:\n            _portable_relative_path(\n                content_path,\n                label=f"{location}.content_path",\n            )\n        except ContentManifestError as error:\n            errors.append(str(error))\n        if isinstance(content_path, str) and content_path:\n            content_paths.append(content_path)\n''',
          )

          replace_once(
              "src/chronopersona/content_integrity.py",
              '''    direct_patterns = raw.get("direct_patterns")\n    if not isinstance(direct_patterns, str) or not direct_patterns:\n        errors.append("direct_patterns must be a nonempty relative path")\n    else:\n        path = PurePosixPath(direct_patterns)\n        if path.is_absolute() or ".." in path.parts or path.suffix != ".json":\n            errors.append("direct_patterns must be a safe relative JSON path")\n''',
              '''    direct_patterns = raw.get("direct_patterns")\n    if not isinstance(direct_patterns, str) or not direct_patterns:\n        errors.append("direct_patterns must be a nonempty relative path")\n    elif "\\\\" in direct_patterns or ":" in direct_patterns:\n        errors.append("direct_patterns must use a portable forward-slash path")\n    else:\n        path = PurePosixPath(direct_patterns)\n        if (\n            path.is_absolute()\n            or ".." in path.parts\n            or path.as_posix() != direct_patterns\n            or path.suffix != ".json"\n        ):\n            errors.append(\n                "direct_patterns must be a canonical portable relative JSON path"\n            )\n''',
          )

          replace_once(
              "scripts/audit_content_integrity.py",
              "from pathlib import Path\n",
              "from pathlib import Path, PurePosixPath\n",
          )
          replace_once(
              "scripts/audit_content_integrity.py",
              '''def _safe_repo_file(repo_root: Path, raw_path: str) -> Path:\n    relative = Path(raw_path)\n    if relative.is_absolute() or ".." in relative.parts:\n        raise ContentIntegrityError("configured direct-pattern path is unsafe")\n    root = repo_root.resolve()\n''',
              '''def _safe_repo_file(repo_root: Path, raw_path: str) -> Path:\n    if "\\\\" in raw_path or ":" in raw_path:\n        raise ContentIntegrityError(\n            "configured direct-pattern path must use portable forward slashes"\n        )\n    portable = PurePosixPath(raw_path)\n    if (\n        portable.is_absolute()\n        or ".." in portable.parts\n        or portable.as_posix() != raw_path\n    ):\n        raise ContentIntegrityError(\n            "configured direct-pattern path must be canonical and relative"\n        )\n    relative = Path(*portable.parts)\n    root = repo_root.resolve()\n''',
          )

          replace_once(
              "tests/test_content_manifest.py",
              '    assert any("content_path must be safe" in error for error in errors)\n',
              '    assert any("portable" in error for error in errors)\n',
          )
          manifest_tests = Path("tests/test_content_manifest.py")
          manifest_tests.write_text(
              manifest_tests.read_text(encoding="utf-8")
              + '''\n\ndef test_windows_style_parent_traversal_is_rejected() -> None:\n    records = list(load_content_manifest(MANIFEST))\n    records[0] = {**records[0], "content_path": r"..\\outside.txt"}\n\n    errors = validate_content_manifest_structure(records)\n    assert any("portable" in error for error in errors)\n\n\ndef test_windows_drive_path_is_rejected() -> None:\n    records = list(load_content_manifest(MANIFEST))\n    records[0] = {**records[0], "content_path": r"C:\\outside.txt"}\n\n    errors = validate_content_manifest_structure(records)\n    assert any("portable" in error for error in errors)\n''',
              encoding="utf-8",
          )

          replace_once(
              "tests/test_content_integrity.py",
              "    validate_holdout_authorization,\n",
              "    validate_holdout_authorization,\n    validate_integrity_config,\n",
          )
          integrity_tests = Path("tests/test_content_integrity.py")
          integrity_tests.write_text(
              integrity_tests.read_text(encoding="utf-8")
              + '''\n\ndef test_config_rejects_windows_style_pattern_paths() -> None:\n    raw = json.loads(CONFIG.read_text(encoding="utf-8"))\n    raw["direct_patterns"] = r"..\\evaluations\\patterns.json"\n\n    errors = validate_integrity_config(raw)\n    assert "direct_patterns must use a portable forward-slash path" in errors\n\n\ndef test_config_rejects_windows_drive_pattern_paths() -> None:\n    raw = json.loads(CONFIG.read_text(encoding="utf-8"))\n    raw["direct_patterns"] = r"C:\\patterns.json"\n\n    errors = validate_integrity_config(raw)\n    assert "direct_patterns must use a portable forward-slash path" in errors\n''',
              encoding="utf-8",
          )

          replace_once(
              "docs/CONTENT_INTEGRITY_PROTOCOL.md",
              "- absolute paths;\n- parent traversal;\n",
              "- absolute paths and Windows drive paths;\n- POSIX or Windows-style parent traversal;\n- backslash-separated or non-canonical relative paths;\n",
          )
          PY

      - name: Validate complete hardened repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q src scripts
          python -m chronopersona validate configs/pilot.toml
          python -m chronopersona validate-models artifacts/manifests/MODEL_MANIFEST.json
          python -m chronopersona validate-evaluation evaluations/registry/development-v0.jsonl
          python scripts/validate_source_registry.py artifacts/manifests/SOURCE_REGISTRY.json
          python scripts/build_synthetic_calibration.py --check
          pytest -q
          git diff --check

      - name: Commit portable-path hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChronoPersona integrity hardening"
          git config user.email "75600769+Parm-1@users.noreply.github.com"
          git add \
            src/chronopersona/content_manifest.py \
            src/chronopersona/content_integrity.py \
            scripts/audit_content_integrity.py \
            tests/test_content_manifest.py \
            tests/test_content_integrity.py \
            docs/CONTENT_INTEGRITY_PROTOCOL.md
          git diff --cached --check
          git commit -m "Harden portable content paths"
          git push origin HEAD:agent/content-integrity-recovery-v1
