schema_version = 2

[experiment]
id = "naturalistic-causal-pilot-v0"
title = "Two-era cross-source causal pilot"
stage = "design"
status = "design"
base_model = "TBD-after-model-and-calibration-audit"
insertion_point = "TBD-after-intermediate-checkpoint-audit"
adaptation_method = "full-weight-continued-pretraining-headline; peft-smoke-only"
# Zero means deliberately unfrozen during design. A measured benchmark and
# explicit user-approved resource plan must set this before status changes.
token_budget = 0
seeds = [17, 29, 43]

[[conditions]]
id = "early-source-a"
role = "temporal"
era = "early"
source_family = "A"
window_start = "2012-01-01"
window_end = "2013-12-31"
manifest = "data/manifests/early-source-a.jsonl"

[[conditions]]
id = "late-source-a"
role = "temporal"
era = "late"
source_family = "A"
window_start = "2018-01-01"
window_end = "2019-12-31"
manifest = "data/manifests/late-source-a.jsonl"

[[conditions]]
id = "early-source-b"
role = "temporal"
era = "early"
source_family = "B"
window_start = "2012-01-01"
window_end = "2013-12-31"
manifest = "data/manifests/early-source-b.jsonl"

[[conditions]]
id = "late-source-b"
role = "temporal"
era = "late"
source_family = "B"
window_start = "2018-01-01"
window_end = "2019-12-31"
manifest = "data/manifests/late-source-b.jsonl"

[[conditions]]
id = "base-model-control"
role = "control"
control_type = "unadapted"

[[conditions]]
id = "common-generic-continuation"
role = "control"
control_type = "generic_continuation"
manifest = "data/manifests/common-generic-continuation.jsonl"

[[conditions]]
id = "matched-mixed-era"
role = "control"
control_type = "mixed_era"
manifest = "data/manifests/matched-mixed-era.jsonl"

[[conditions]]
id = "within-era-pseudo-era-placebo"
role = "control"
control_type = "within_era_placebo"
manifest = "data/manifests/within-era-pseudo-era-placebo.jsonl"

[evaluation]
registry = "evaluations/registry/cstg-pilot-v0.jsonl"
primary_families = [
  "evidence-integration",
  "procedural-tradeoffs",
]
secondary_families = [
  "secure-system-decisions",
]
held_out_source_family = "C"
blinded = true
frozen_before_training = true

[resource_constraints]
# The default authorization envelope is local-only and zero external spend.
# Changing this value does not itself authorize spending.
external_spend_cad = 0
external_compute_requires_user_authorization = true
training_requires_measured_benchmark = true
calibration_required_before_naturalistic_interpretation = true
max_parallel_training_jobs = 1

[reporting]
output_dir = "results/naturalistic-causal-pilot-v0"
publish_negative_results = true
