[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronopersona"
version = "0.1.0"
description = "Reproducible experiments on temporal adaptation in language models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Parm-1" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]
tokenizers = [
  "huggingface-hub>=0.34",
  "transformers>=4.48"
]
models = [
  "accelerate>=1.0",
  "huggingface-hub>=0.34",
  "safetensors>=0.5",
  "torch>=2.5",
  "transformers>=4.48"
]

[project.scripts]
chronopersona = "chronopersona.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
